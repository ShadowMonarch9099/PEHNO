# Local full-stack: API + Postgres + Redis + Celery worker/beat.
# Usage: docker compose -f infra/docker-compose.yml up
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: pehno
      POSTGRES_PASSWORD: pehno
      POSTGRES_DB: pehno
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pehno"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redisdata:/data]

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file: ../apps/api/.env
    environment: &api_env
      DATABASE_URL: postgresql+asyncpg://pehno:pehno@db:5432/pehno
      CELERY_BROKER_URL: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
      LOCAL_MEDIA_DIR: /data/media
      KNOWLEDGE_DIR: /app/packages/ai/data
    ports: ["8000:8000"]
    volumes: [media:/data/media]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    command: celery -A app.tasks worker --loglevel=info --concurrency=2
    env_file: ../apps/api/.env
    environment: *api_env
    volumes: [media:/data/media]
    depends_on: [api]

  beat:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    command: celery -A app.tasks beat --loglevel=info
    env_file: ../apps/api/.env
    environment: *api_env
    depends_on: [redis]

volumes:
  pgdata:
  redisdata:
  media:
