# Reverse proxy for production (Railway/Render front the API directly, so this is
# only needed for self-hosting). Terminates TLS and forwards to the API container.
events {}
http {
  client_max_body_size 20m;   # garment photo uploads

  server {
    listen 80;
    server_name api.pehno.in;

    location / {
      proxy_pass http://api:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
