name: Test

on:
  pull_request:
  push:
    branches: [main, "rebuild/**", "feat/**"]
  workflow_call:

jobs:
  api:
    name: API — lint, format, tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    env:
      APP_ENV: test
      JWT_SECRET: ci-only-secret-key-32-characters-x
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: apps/api/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: Migrations apply on a clean SQLite DB
        run: alembic upgrade head
        env: { DATABASE_URL: "sqlite+aiosqlite:///./ci.db" }

  mobile:
    name: Mobile — typecheck + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit -p apps/mobile
      - run: npx eslint . --ext .ts,.tsx
        working-directory: apps/mobile

  admin:
    name: Admin — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx eslint . --ext .ts,.tsx
        working-directory: apps/admin
      - run: npx next build
        working-directory: apps/admin
        env: { NEXTAUTH_SECRET: ci-only, ADMIN_API_KEY: ci-only }
