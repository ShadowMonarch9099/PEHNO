version: '3.9'

services:
  # ── FastAPI Backend ────────────────────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./apps/api/.env
    volumes:
      - ./apps/api:/app
      - ./packages:/packages
    depends_on:
      - redis
    command: >
      uvicorn main:app
      --host 0.0.0.0
      --port 8000
      --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Celery Worker ──────────────────────────────────────────────────────────
  celery_worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    env_file:
      - ./apps/api/.env
    volumes:
      - ./apps/api:/app
    depends_on:
      - redis
    command: celery -A app.celery_app.celery_app worker --loglevel=info --concurrency=2
    restart: unless-stopped

  # ── Celery Beat Scheduler ──────────────────────────────────────────────────
  celery_beat:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    env_file:
      - ./apps/api/.env
    volumes:
      - ./apps/api:/app
    depends_on:
      - redis
    command: celery -A app.celery_app.celery_app beat --loglevel=info
    restart: unless-stopped

  # ── Redis (Broker + Cache) ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Flower (Celery Monitor) ────────────────────────────────────────────────
  flower:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    env_file:
      - ./apps/api/.env
    ports:
      - "5555:5555"
    depends_on:
      - redis
    command: celery -A app.celery_app.celery_app flower --port=5555
    restart: unless-stopped

volumes:
  redis_data:
